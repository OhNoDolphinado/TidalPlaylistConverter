<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Tidal Playlist Converter</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/css/favicon.ico">
</head>
<body>

  <script src="/js/app.js"></script>
  <!-- ===== NAVBAR ===== -->
  <script src="/js/components/header.js"></script> <!-- Imports header from components folder -->

  <!-- ===== AUTH FORM ===== -->
  <main class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">🎵</div>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your TidalConverter account</p>

      <!-- Alerts -->
      <div class="alert alert-error" id="error-msg" role="alert">
        <span>⚠</span><span id="error-text"></span>
      </div>
      <div class="alert alert-success" id="success-msg" role="alert">
        <span>✓</span><span id="success-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-2" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create one free</a>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <script src="/js/components/footer.js"></script> <!-- Imports footer from components folder -->

  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          setLoggedIn();
          showSuccess('Signed in! Redirecting…');
          setTimeout(() => { window.location.href = '/profile'; }, 900);
        } else {
          showError(data.error || 'Invalid email or password.');
          resetBtn();
        }
      } catch (_) {
        showError('Network error. Please try again.');
        resetBtn();
      }
    });

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.add('show');
    }
    function showSuccess(msg) {
      document.getElementById('success-text').textContent = msg;
      document.getElementById('success-msg').classList.add('show');
    }
    function clearAlerts() {
      document.getElementById('error-msg').classList.remove('show');
      document.getElementById('success-msg').classList.remove('show');
    }
    function resetBtn() {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Sign In';
    }
  </script>
</body>
</html>
