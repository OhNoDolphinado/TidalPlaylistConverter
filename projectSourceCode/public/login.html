<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tidal Playlist Converter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>🎵 Tidal Playlist Converter</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/login">Login</a>
    </nav>
  </header>

  <main>
    <section style="max-width: 400px; margin: 4rem auto;">
      <h2>Login</h2>
      <form action="/login" method="post">
        <input type="email" name="email" placeholder="Email" required style="width: 100%; padding: 0.75rem; margin: 0.5rem 0;">
        <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 0.75rem; margin: 0.5rem 0;">
        <button type="submit" style="width: 100%; margin-top: 1rem;">Login</button>
      </form>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
