<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tidal Playlist Converter</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <script src="/js/components/header.js"></script> <!-- Imports header from components folder -->

    <main>
    <section style="max-width: 400px; margin: 4rem auto;">
      <h2>Login</h2>
      <div id="error-message" style="color: red; display: none;"></div>
      <form id="login-form">
        <input type="email" id="email" name="email" placeholder="Email" required style="width: 100%; padding: 0.75rem; margin: 0.5rem 0;">
        <input type="password" id="password" name="password" placeholder="Password" required style="width: 100%; padding: 0.75rem; margin: 0.5rem 0;">
        <button type="submit" style="width: 100%; margin-top: 1rem;">Login</button>
      </form>
      <p style="text-align: center; margin-top: 1rem;">
        Don't have an account? <a href="/register">Register here</a>
      </p>
    </section>
  </main>
  
  <footer class="bg-dark">
    <p style="color: #ffffff;">&copy; 2026 Tidal Playlist Converter. All rights reserved.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Clear previous messages
      document.getElementById('error-message').style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/profile';
        } else {
          showError(data.error || 'Login failed');
        }
      } catch (error) {
        showError('Network error. Please try again.');
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
