<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Tidal Playlist Converter</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <script src="/js/components/header.js"></script> <!-- Imports header from components folder -->

  <!-- ===== PROFILE ===== -->
  <main>
    <div class="profile-page" id="profile-page" style="display:none;">

      <!-- Profile hero -->
      <div class="profile-hero">
        <div class="profile-avatar" id="user-avatar">?</div>
        <div class="profile-info">
          <h2 id="user-name">Loading…</h2>
          <p id="user-email">—</p>
          <p style="margin-top:0.4rem;">
            <span class="badge badge-green">Active member</span>
          </p>
        </div>
        <div class="profile-actions">
          <button class="btn btn-secondary btn-sm" onclick="toggleEdit()">Edit Profile</button>
          <button class="btn btn-danger btn-sm" onclick="handleLogout(event)">Sign Out</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-playlists">0</div>
          <div class="stat-label">Playlists Converted</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-tracks">—</div>
          <div class="stat-label">Tracks Moved</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-since">—</div>
          <div class="stat-label">Member Since</div>
        </div>
      </div>

      <!-- Account details -->
      <div class="profile-section">
        <h3>Account Details</h3>
        <div class="detail-row">
          <span class="detail-label">Full name</span>
          <span class="detail-value" id="detail-name">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email address</span>
          <span class="detail-value" id="detail-email">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Member since</span>
          <span class="detail-value" id="detail-since">—</span>
        </div>
      </div>

      <!-- Connected Accounts -->
      <div class="profile-section" id="connected-accounts-section">
        <h3>Connected Accounts</h3>
        <div class="detail-row" style="align-items:center;">
          <span class="detail-label" style="display:flex;align-items:center;gap:0.5rem;">
            <!-- Spotify logo -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1DB954" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 01-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.623.623 0 01-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.622.622 0 01.207.857zm1.223-2.722a.78.78 0 01-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 01-.973-.519.781.781 0 01.52-.972c3.632-1.102 8.147-.568 11.233 1.328a.78.78 0 01.257 1.072zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.937.937 0 11-.543-1.793c3.527-1.07 9.396-.863 13.101 1.332a.937.937 0 01-.94 1.618z"/>
            </svg>
            Spotify
          </span>
          <span class="detail-value" id="spotify-status-text">Checking…</span>
          <span style="margin-left:auto;">
            <button id="spotify-connect-btn"    class="btn btn-primary btn-sm"  onclick="connectSpotify()"    style="display:none;">Connect</button>
            <button id="spotify-disconnect-btn" class="btn btn-danger  btn-sm"  onclick="disconnectSpotify()" style="display:none;">Disconnect</button>
          </span>
        </div>
        <div class="detail-row" style="align-items:center;">
          <span class="detail-label" style="display:flex;align-items:center;gap:0.5rem;">
            <!-- Tidal logo -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#00c9b1" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L8 6l4 4 4-4-4-4zM4 10l-4 4 4 4 4-4-4-4zm8 0l-4 4 4 4 4-4-4-4zm8 0l-4 4 4 4 4-4-4-4z"/>
            </svg>
            Tidal
          </span>
          <span class="detail-value" id="tidal-status-text">Checking…</span>
          <span style="margin-left:auto;">
            <button id="tidal-connect-btn"    class="btn btn-primary btn-sm"  onclick="connectTidal()"    style="display:none;">Connect</button>
            <button id="tidal-disconnect-btn" class="btn btn-danger  btn-sm"  onclick="disconnectTidal()" style="display:none;">Disconnect</button>
          </span>
        </div>
      </div>

      <!-- Spotify Playlists -->
      <div class="profile-section hidden" id="spotify-playlists-section">
        <h3>Spotify Playlists</h3>
        <div id="playlists-grid" class="playlists-grid"></div>
      </div>

      <!-- Edit form (hidden by default) -->
      <div class="profile-section hidden" id="edit-section">
        <h3>Edit Profile</h3>
        <div class="alert alert-error" id="edit-error" role="alert">
          <span>⚠</span><span id="edit-error-text"></span>
        </div>
        <div class="alert alert-success" id="edit-success" role="alert">
          <span>✓</span><span id="edit-success-text"></span>
        </div>
        <form id="edit-form">
          <div class="form-group">
            <label for="edit-name">Full name</label>
            <input type="text" id="edit-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="edit-email">Email address</label>
            <input type="email" id="edit-email" class="form-control" required>
          </div>
          <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary btn-sm" id="edit-submit-btn">Save Changes</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="toggleEdit()">Cancel</button>
          </div>
        </form>
      </div>

    </div>

    <!-- Loading state -->
    <div id="loading-state" class="flex-center" style="min-height:60vh;">
      <div style="text-align:center;">
        <div class="spinner" style="width:40px;height:40px;margin:0 auto 1rem;"></div>
        <p style="color:var(--text-muted);">Loading your profile…</p>
      </div>
    </div>
  </main>

  <!-- Track Modal -->
  <div id="track-modal" class="modal-overlay hidden" onclick="handleModalBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3 id="modal-playlist-name"></h3>
          <p id="modal-playlist-meta"></p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="closeTrackModal()" style="flex-shrink:0;">✕</button>
      </div>
      <div id="modal-tracks" class="track-list"></div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <script src="/js/components/footer.js"></script> <!-- Imports footer from components folder -->

  <script>
    let userData = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadSpotifyStatus();
      loadTidalStatus();
    });

    async function loadProfile() {
      try {
        const res = await fetch('/api/auth/profile');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const data = await res.json();
        userData = data.user;
        renderProfile(data);
      } catch (_) {
        window.location.href = '/login';
      }
    }

    function renderProfile(data) {
      const u = data.user;
      const memberYear = new Date(u.created_at).getFullYear();

      // Avatar initials
      document.getElementById('user-avatar').textContent = (u.name || '?')[0].toUpperCase();

      // Hero
      document.getElementById('user-name').textContent  = u.name;
      document.getElementById('user-email').textContent = u.email;

      // Stats
      document.getElementById('stat-playlists').textContent = data.playlistsCount ?? 0;
      document.getElementById('stat-tracks').textContent    = '—';
      document.getElementById('stat-since').textContent     = memberYear;

      // Details
      document.getElementById('detail-name').textContent  = u.name;
      document.getElementById('detail-email').textContent = u.email;
      document.getElementById('detail-since').textContent = new Date(u.created_at).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });

      // Prefill edit form
      document.getElementById('edit-name').value  = u.name;
      document.getElementById('edit-email').value = u.email;

      // Update navbar to logged-in state
      document.getElementById('nav-login').classList.add('hidden');
      document.getElementById('nav-register').classList.add('hidden');
      document.getElementById('nav-profile').classList.remove('hidden');
      document.getElementById('nav-playlists')?.classList.remove('hidden');
      document.getElementById('nav-logout').classList.remove('hidden');

      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('profile-page').style.display  = 'block';
    }

    function toggleEdit() {
      const section = document.getElementById('edit-section');
      section.classList.toggle('hidden');
      clearEditAlerts();
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearEditAlerts();
      const name  = document.getElementById('edit-name').value.trim();
      const email = document.getElementById('edit-email').value.trim();
      if (!name || !email) {
        showEditError('Please fill in all fields.');
        return;
      }
      const btn = document.getElementById('edit-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        });
        const data = await res.json();
        if (res.ok) {
          showEditSuccess('Profile updated!');
          document.getElementById('user-name').textContent    = name;
          document.getElementById('user-email').textContent   = email;
          document.getElementById('user-avatar').textContent  = name[0].toUpperCase();
          document.getElementById('detail-name').textContent  = name;
          document.getElementById('detail-email').textContent = email;
          setTimeout(toggleEdit, 1200);
        } else {
          showEditError(data.error || 'Update failed.');
        }
      } catch (_) {
        showEditError('Network error.');
      }
      btn.disabled = false;
      btn.innerHTML = 'Save Changes';
    });

    async function handleLogout(e) {
      e.preventDefault();
      setLoggedOut();
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (_) {}
      window.location.href = '/';
    }

    async function loadSpotifyStatus() {
      try {
        const res  = await fetch('/api/spotify/status');
        const data = await res.json();
        const statusText    = document.getElementById('spotify-status-text');
        const connectBtn    = document.getElementById('spotify-connect-btn');
        const disconnectBtn = document.getElementById('spotify-disconnect-btn');

        if (data.connected) {
          statusText.textContent       = data.display_name ? `Connected as ${data.display_name}` : 'Connected';
          statusText.style.color       = 'var(--green)';
          connectBtn.style.display    = 'none';
          disconnectBtn.style.display = 'inline-flex';
          loadSpotifyPlaylists();
        } else {
          statusText.textContent       = 'Not connected';
          statusText.style.color       = 'var(--text-muted)';
          connectBtn.style.display    = 'inline-flex';
          disconnectBtn.style.display = 'none';
          document.getElementById('spotify-playlists-section').classList.add('hidden');
        }
      } catch (_) {
        document.getElementById('spotify-status-text').textContent = 'Unavailable';
      }
    }

    function connectSpotify() {
      window.location.href = '/api/spotify/login';
    }

    async function disconnectSpotify() {
      try {
        await fetch('/api/spotify/disconnect', { method: 'POST' });
        loadSpotifyStatus();
      } catch (_) {}
    }

    async function loadTidalStatus() {
      try {
        const res  = await fetch('/api/tidal/status');
        const data = await res.json();
        const statusText    = document.getElementById('tidal-status-text');
        const connectBtn    = document.getElementById('tidal-connect-btn');
        const disconnectBtn = document.getElementById('tidal-disconnect-btn');

        if (data.connected) {
          statusText.textContent      = data.display_name ? `Connected as ${data.display_name}` : 'Connected';
          statusText.style.color      = 'var(--teal)';
          connectBtn.style.display    = 'none';
          disconnectBtn.style.display = 'inline-flex';
        } else {
          statusText.textContent      = 'Not connected';
          statusText.style.color      = 'var(--text-muted)';
          connectBtn.style.display    = 'inline-flex';
          disconnectBtn.style.display = 'none';
        }
      } catch (_) {
        document.getElementById('tidal-status-text').textContent = 'Unavailable';
      }
    }

    function connectTidal() {
      window.location.href = '/api/tidal/login';
    }

    async function disconnectTidal() {
      try {
        await fetch('/api/tidal/disconnect', { method: 'POST' });
        loadTidalStatus();
      } catch (_) {}
    }

    async function loadSpotifyPlaylists() {
      try {
        const res = await fetch('/api/spotify/playlists');
        if (!res.ok) return;
        const data = await res.json();
        renderPlaylists(data.playlists);
        document.getElementById('spotify-playlists-section').classList.remove('hidden');
      } catch (err) { console.error('loadSpotifyPlaylists error:', err); }
    }

    function renderPlaylists(playlists) {
      const grid = document.getElementById('playlists-grid');
      grid.innerHTML = playlists.map(p => {
        const imgUrl = p.images?.[0]?.url;
        const imgEl = imgUrl
          ? `<img class="playlist-card-img" src="${imgUrl}" alt="" loading="lazy">`
          : `<div class="playlist-card-placeholder">🎵</div>`;
        const total = p.tracks?.total ?? p.items?.total ?? '?';
        return `
          <div class="playlist-card"
               data-id="${p.id}"
               data-name="${escHtml(p.name)}"
               data-total="${total}"
               onclick="openPlaylist(this)">
            ${imgEl}
            <div class="playlist-card-name">${escHtml(p.name)}</div>
            <div class="playlist-card-count">${total} tracks</div>
          </div>`;
      }).join('');
    }

    async function openPlaylist(card) {
      const id    = card.dataset.id;
      const name  = card.dataset.name;
      const total = card.dataset.total;

      document.getElementById('modal-playlist-name').textContent = name;
      document.getElementById('modal-playlist-meta').textContent = `${total} tracks`;
      document.getElementById('modal-tracks').innerHTML =
        '<div style="padding:2rem;text-align:center;"><div class="spinner" style="width:32px;height:32px;margin:0 auto;"></div></div>';
      document.getElementById('track-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      try {
        const res  = await fetch(`/api/spotify/playlists/${id}/tracks`);
        const data = await res.json();
        renderTracks(data.tracks);
      } catch (_) {
        document.getElementById('modal-tracks').innerHTML =
          '<p style="padding:2rem;text-align:center;color:var(--text-muted);">Failed to load tracks.</p>';
      }
    }

    function renderTracks(items) {
      const list = document.getElementById('modal-tracks');
      const valid = items.filter(item => item.track || item.item);
      if (!valid.length) {
        list.innerHTML = '<p style="padding:2rem;text-align:center;color:var(--text-muted);">No tracks found.</p>';
        return;
      }
      list.innerHTML = valid.map((item, i) => {
        const t      = item.track || item.item;
        const imgUrl = t.album?.images?.[2]?.url || t.album?.images?.[0]?.url;
        const imgEl  = imgUrl
          ? `<img class="track-art" src="${imgUrl}" alt="" loading="lazy">`
          : `<div class="track-art" style="display:flex;align-items:center;justify-content:center;">🎵</div>`;
        const artists  = t.artists.map(a => escHtml(a.name)).join(', ');
        const duration = fmtMs(t.duration_ms);
        return `
          <div class="track-item">
            <span class="track-num">${i + 1}</span>
            ${imgEl}
            <div class="track-info">
              <div class="track-name">${escHtml(t.name)}</div>
              <div class="track-artist">${artists}</div>
            </div>
            <span class="track-duration">${duration}</span>
          </div>`;
      }).join('');
    }

    function closeTrackModal() {
      document.getElementById('track-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function handleModalBackdrop(e) {
      if (e.target === document.getElementById('track-modal')) closeTrackModal();
    }

    function fmtMs(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showEditError(msg) {
      document.getElementById('edit-error-text').textContent = msg;
      document.getElementById('edit-error').classList.add('show');
    }
    function showEditSuccess(msg) {
      document.getElementById('edit-success-text').textContent = msg;
      document.getElementById('edit-success').classList.add('show');
    }
    function clearEditAlerts() {
      document.getElementById('edit-error').classList.remove('show');
      document.getElementById('edit-success').classList.remove('show');
    }
  </script>
</body>
</html>
