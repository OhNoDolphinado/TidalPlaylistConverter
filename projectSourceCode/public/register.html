<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Tidal Playlist Converter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <script src="/js/components/header.js"></script> <!-- Imports header from components folder -->

  <!-- ===== AUTH FORM ===== -->
  <main class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">🎵</div>
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Start converting playlists for free</p>

      <!-- Alerts -->
      <div class="alert alert-error" id="error-msg" role="alert">
        <span>⚠</span><span id="error-text"></span>
      </div>
      <div class="alert alert-success" id="success-msg" role="alert">
        <span>✓</span><span id="success-text"></span>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="Jane Smith"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Min. 8 characters"
            autocomplete="new-password"
            required
            minlength="8"
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-2" id="submit-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <script src="/js/components/footer.js"></script> <!-- Imports footer from components folder -->

  <script>
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm-password').value;

      if (!name || !email || !password || !confirm) {
        showError('Please fill in all fields.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showSuccess('Account created! Taking you to your profile…');
          setTimeout(() => { window.location.href = '/profile'; }, 1200);
        } else {
          showError(data.error || 'Registration failed. Please try again.');
          resetBtn();
        }
      } catch (_) {
        showError('Network error. Please try again.');
        resetBtn();
      }
    });

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.add('show');
    }
    function showSuccess(msg) {
      document.getElementById('success-text').textContent = msg;
      document.getElementById('success-msg').classList.add('show');
    }
    function clearAlerts() {
      document.getElementById('error-msg').classList.remove('show');
      document.getElementById('success-msg').classList.remove('show');
    }
    function resetBtn() {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Create Account';
    }
  </script>
</body>
</html>
